syntax = "proto3";

// pedido do bot para o servidor (REQ)
message Requisicao {
    string tipo = 1;       // login, canal, listar, publicar
    string usuario = 2;
    string canal = 3;
    double timestamp = 4;
    string texto = 5;
    int64 relogio = 6;     // relogio logico de quem envia
    Prova prova = 7;       // so no login
    string sessao = 8;     // devolvida no login, vai em canal e publicar
}

// prova de conhecimento zero do login (isomorfismo de grafos, nao interativa)
// o bot prova que conhece pi tal que g1 = pi(g0), sem mostrar pi
message Prova {
    int32 n = 1;               // vertices
    bytes g0 = 2;              // arestas (i, j), i < j, como bits
    bytes g1 = 3;
    int64 instante = 4;        // milissegundos, entra no hash
    repeated bytes h = 5;      // compromisso de cada rodada: sigma(g0)
    repeated bytes resposta = 6; // permutacao de cada rodada (n bytes)
}

// resposta do servidor para o bot (REP)
message Resposta {
    string status = 1;     // ok ou erro
    string erro = 2;
    repeated string canais = 3;
    double timestamp = 4;
    int64 relogio = 5;
    string sessao = 6;
}

// mensagem publicada pelo servidor no canal (PUB, topico = nome do canal)
message Publicacao {
    string canal = 1;
    string usuario = 2;
    string texto = 3;
    double timestamp = 4;
    int64 relogio = 5;
}

message Servidor {
    string nome = 1;
    int32 rank = 2;
}

// mensagens entre os servidores e o servico de referencia (REQ e REP)
// e entre os servidores (relogio, eleicao e o anuncio do coordenador no topico servers)
message Controle {
    string tipo = 1;       // rank, list, heartbeat, relogio, eleicao, coordenador, sincronizar
    string nome = 2;
    string status = 3;
    int32 rank = 4;
    repeated Servidor servidores = 5;
    double hora = 6;       // hora correta, para acertar o relogio fisico
    double timestamp = 7;
    int64 relogio = 8;
    repeated Evento eventos = 9;   // resposta do sincronizar
}

// tudo que muda os dados de um servidor; vai para o disco e para os outros
// servidores pelo topico replica
message Evento {
    string id = 1;
    string ev = 2;         // login, canal, msg
    string usuario = 3;
    string canal = 4;
    string texto = 5;
    double timestamp = 6;
    int64 relogio = 7;
    string origem = 8;     // servidor que recebeu o pedido do bot
    string g0 = 9;         // chave publica do login (hex)
    string g1 = 10;
    string sessao = 11;
}

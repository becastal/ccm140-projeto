syntax = "proto3";

// pedido do bot para o servidor (REQ)
message Requisicao {
    string tipo = 1;       // login, canal, listar, publicar
    string usuario = 2;
    string canal = 3;
    double timestamp = 4;
    string texto = 5;
    int64 relogio = 6;     // relogio logico de quem envia
}

// resposta do servidor para o bot (REP)
message Resposta {
    string status = 1;     // ok ou erro
    string erro = 2;
    repeated string canais = 3;
    double timestamp = 4;
    int64 relogio = 5;
}

// mensagem publicada pelo servidor no canal (PUB, topico = nome do canal)
message Publicacao {
    string canal = 1;
    string usuario = 2;
    string texto = 3;
    double timestamp = 4;
    int64 relogio = 5;
}

message Servidor {
    string nome = 1;
    int32 rank = 2;
}

// mensagens entre os servidores e o servico de referencia (REQ e REP)
message Controle {
    string tipo = 1;       // rank, list, heartbeat
    string nome = 2;
    string status = 3;
    int32 rank = 4;
    repeated Servidor servidores = 5;
    double hora = 6;       // hora correta, para acertar o relogio fisico
    double timestamp = 7;
    int64 relogio = 8;
}
